<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Biru Modern</title>
    <style>
        :root {
            --bg-body: #e3f2fd;
            --bg-calc: #ffffff;
            --primary-blue: #0077b6;
            --secondary-blue: #00b4d8;
            --text-dark: #023e8a;
            --btn-hover: #90e0ef;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .calculator {
            background-color: var(--bg-calc);
            width: 320px;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 119, 182, 0.2);
        }

        #display {
            width: 100%;
            height: 60px;
            font-size: 2rem;
            text-align: right;
            margin-bottom: 20px;
            padding: 10px;
            box-sizing: border-box;
            border: none;
            background: #f1f8ff;
            color: var(--text-dark);
            border-radius: 10px;
            outline: none;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 20px;
            font-size: 1.2rem;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            background-color: #f8fbff;
            color: var(--primary-blue);
            transition: all 0.2s;
            font-weight: bold;
        }

        button:hover {
            background-color: var(--btn-hover);
        }

        .operator {
            background-color: var(--primary-blue);
            color: white;
        }

        .operator:hover {
            background-color: var(--dark-blue);
        }

        .equals {
            background-color: #03045e;
            color: white;
            grid-column: span 2;
        }

        .clear {
            color: #d00000;
        }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" disabled>
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button onclick="deleteLast()">DEL</button>
        <button onclick="appendToDisplay('%')">%</button>
        <button class="operator" onclick="appendToDisplay('/')">/</button>
        
        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button>
        <button class="operator" onclick="appendToDisplay('*')">×</button>
        
        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button>
        <button class="operator" onclick="appendToDisplay('-')">-</button>
        
        <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button>
        <button class="operator" onclick="appendToDisplay('+')">+</button>
        
        <button onclick="calculateSquare()">x²</button>
        <button onclick="appendToDisplay('0')">0</button>
        <button onclick="appendToDisplay('.')">.</button>
        <button onclick="calculateSqrt()">√</button>

        <button class="equals" onclick="calculateResult()">=</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');

    function appendToDisplay(input) {
        display.value += input;
    }

    function clearDisplay() {
        display.value = '';
    }

    function deleteLast() {
        display.value = display.value.slice(0, -1);
    }

    function calculateResult() {
        try {
            // Mengganti simbol persen agar bisa dihitung
            let expression = display.value.replace('%', '/100');
            display.value = eval(expression);
        } catch (error) {
            display.value = 'Error';
        }
    }

    function calculateSquare() {
        try {
            display.value = Math.pow(eval(display.value), 2);
        } catch (error) {
            display.value = 'Error';
        }
    }

    function calculateSqrt() {
        try {
            display.value = Math.sqrt(eval(display.value));
        } catch (error) {
            display.value = 'Error';
        }
    }
</script>

</body>
</html>
